<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Telecom Expense Analytics Dashboard (16:9 Bright Mode)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- SheetJS (xlsx reader) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Live Google Sheet Target Configuration (Updated with GID from screenshot)
        const SHEET_ID = '12ATUEH9tkgrKU4I47nW4UPhU9rEujCpD5lVNhmJCnBQ';
        const SHEET_NAME = 'analyst';
        const SHEET_GID = '739602386'; // Primary GID from active sheet in screenshot

        // Tier Configuration Mapping (7 Tiers)
        const TIER_CONFIG = {
            '1000plus': { label: '1,000 ขึ้นไป', class: 'tier-badge-1000plus', color: '#e11d48' },
            '800-1000': { label: '800 - 1,000', class: 'tier-badge-800-1000', color: '#ea580c' },
            '500-800': { label: '500 - 800', class: 'tier-badge-500-800', color: '#ca8a04' },
            '300-500': { label: '300 - 500', class: 'tier-badge-300-500', color: '#65a30d' },
            '100-300': { label: '100 - 300', class: 'tier-badge-100-300', color: '#0d9488' },
            'under100': { label: 'ต่ำกว่า 100', class: 'tier-badge-under100', color: '#0284c7' },
            '0': { label: '0 บาท', class: 'tier-badge-0', color: '#64748b' }
        };

        // Global Application State Variables
        let rawDataset = [];
        let filteredDataset = [];
        
        // Tab State
        let currentTab = 'overview';

        // Overview Chart Instances
        let tierDoughnutChartInstance = null;
        let deptBarChartInstance = null;
        let overviewPage = 1;
        
        // MVPN Chart Instances & Table Pagination Pages
        let mvpnDoughnutChartInstance = null;
        let mvpnDeptBarChartInstance = null;
        let mvpnAisPage = 1;
        let mvpnOtherPage = 1;
        
        const pageSize = 10;

        window.onload = function () {
            if (typeof ChartDataLabels !== 'undefined') {
                Chart.register(ChartDataLabels);
            }
            setupEventListeners();
            fetchGoogleSheetData();
        };

        async function fetchGoogleSheetData() {
            const syncDot = document.getElementById('syncDot');
            const syncText = document.getElementById('syncText');
            const refreshIcon = document.getElementById('refreshIcon');
            const errorBanner = document.getElementById('errorMessageBanner');
            
            refreshIcon.classList.add('fa-spin');
            syncText.innerText = `กำลังดึงข้อมูล Google Sheet (${SHEET_NAME})...`;
            syncDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            errorBanner.classList.add('hidden');

            let parsedItems = null;

            // Strategy 1: Fetch GViz JSON format across all candidate GIDs and sheet names
            const jsonUrls = [
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`,
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`,
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=668194401`,
                `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`
            ];

            for (const url of jsonUrls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const txt = await res.text();
                        const jsonObj = extractGVizJSON(txt);
                        if (jsonObj) {
                            parsedItems = parseGvizJSON(jsonObj);
                            if (parsedItems && parsedItems.length > 0) break;
                        }
                    }
                } catch (e) {
                    console.warn('GViz JSON fetch attempt failed, trying next method...', e);
                }
            }

            // Strategy 2: Fetch CSV format if JSON didn't return items
            if (!parsedItems || parsedItems.length === 0) {
                const csvUrls = [
                    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`,
                    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`,
                    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`
                ];

                for (const url of csvUrls) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const txt = await res.text();
                            if (txt && txt.trim().length > 20 && !txt.includes('<!DOCTYPE html>')) {
                                const parsedRows = parseCSV(txt);
                                if (parsedRows && parsedRows.length > 1) {
                                    parsedItems = processRawRows([], parsedRows);
                                    if (parsedItems && parsedItems.length > 0) break;
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('CSV fetch failed, trying next method...', e);
                    }
                }
            }

            try {
                if (!parsedItems || parsedItems.length === 0) {
                    throw new Error('ไม่พบข้อมูลจาก Google Sheet');
                }

                rawDataset = parsedItems;
                
                syncText.innerText = `ดึงข้อมูลสำเร็จ (Google Sheet: ${SHEET_NAME} - ${rawDataset.length} รายการ)`;
                syncDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('lastUpdatedTime').innerText = `อัปเดต: ${new Date().toLocaleTimeString('th-TH')}`;
                
                processDataset();

            } catch (error) {
                console.error('Google Sheet Live Fetch Error:', error);
                syncText.innerText = "ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ";
                syncDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
                errorBanner.classList.remove('hidden');
                
                rawDataset = [];
                processDataset();
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // Helper function to extract valid JSON from Google's setResponse text
        function extractGVizJSON(txt) {
            if (!txt) return null;
            const startIdx = txt.indexOf('{');
            const endIdx = txt.lastIndexOf('}');
            if (startIdx !== -1 && endIdx > startIdx) {
                const jsonStr = txt.substring(startIdx, endIdx + 1);
                try {
                    return JSON.parse(jsonStr);
                } catch (e) {
                    console.error('GViz JSON parsing error:', e);
                }
            }
            return null;
        }

        function parseGvizJSON(jsonObj) {
            if (!jsonObj || !jsonObj.table) return [];
            const cols = jsonObj.table.cols || [];
            const rows = jsonObj.table.rows || [];
            
            const headerLabels = cols.map(c => (c && (c.label || c.id) ? String(c.label || c.id).trim().toLowerCase() : ''));
            
            const tableData = [];
            rows.forEach(r => {
                if (!r || !r.c) return;
                const rowVals = r.c.map(cell => {
                    if (!cell) return '';
                    if (cell.v !== undefined && cell.v !== null) return cell.v;
                    if (cell.f !== undefined && cell.f !== null) return cell.f;
                    return '';
                });
                tableData.push(rowVals);
            });

            return processRawRows(headerLabels, tableData);
        }

        function processRawRows(initialHeaders, dataRows) {
            let headers = initialHeaders.map(h => String(h).trim().toLowerCase());
            let startRowIdx = 0;

            const keywords = ['เบอร์', 'phone', 'หน่วยงาน', 'บาท', 'ชื่อ', 'vat', 'pre', 'mvpn', 'เดือน', 'งวด'];
            const hasHeaderMatch = headers.some(h => keywords.some(k => h.includes(k)));

            if (!hasHeaderMatch && dataRows.length > 0) {
                for (let r = 0; r < Math.min(5, dataRows.length); r++) {
                    const rStr = dataRows[r].join(' ').toLowerCase();
                    if (keywords.some(k => rStr.includes(k))) {
                        headers = dataRows[r].map(h => String(h).trim().toLowerCase());
                        startRowIdx = r + 1;
                        break;
                    }
                }
            }

            const monthIdx = headers.findIndex(h => /เดือน|month|period|งวด/i.test(h));
            const phoneIdx = headers.findIndex(h => /เบอร์|phone|mobile|tel|number/i.test(h));
            const nameIdx = headers.findIndex(h => /ชื่อ|name|user|employee|ผู้ใช้/i.test(h));
            const deptIdx = headers.findIndex(h => /หน่วยงาน|สังกัด|แผนก|department|dept|section|ฝ่าย/i.test(h));
            const amtIdx = headers.findIndex(h => /ก่อน|vat|pre|ยอด|ค่าบริการ|ค่าใช้จ่าย|amount|price|total/i.test(h));

            const mvpnAisIdx = headers.findIndex(h => 
                (h.includes('ais') || h.includes('ในเครือข่าย') || h.includes('on-net')) && 
                !h.includes('นอก') && !h.includes('off') && !h.includes('other')
            );

            const mvpnOtherIdx = headers.findIndex(h => 
                h.includes('นอก') || h.includes('off') || h.includes('other') || h.includes('non')
            );

            const items = [];
            for (let i = startRowIdx; i < dataRows.length; i++) {
                const row = dataRows[i];
                if (!row || row.length === 0) continue;

                const rawAmt = amtIdx >= 0 ? row[amtIdx] : (row[3] || '0');
                const cleanAmt = typeof rawAmt === 'number' ? rawAmt : (parseFloat(String(rawAmt).replace(/,/g, '').replace(/฿/g, '')) || 0);

                const phoneVal = phoneIdx >= 0 ? row[phoneIdx] : (row[0] || '-');
                const nameVal = nameIdx >= 0 ? row[nameIdx] : (row[1] || 'ไม่ระบุชื่อ');
                const deptVal = deptIdx >= 0 ? row[deptIdx] : (row[2] || 'ไม่ระบุหน่วยงาน');
                const monthVal = monthIdx >= 0 ? row[monthIdx] : (row[6] || 'ปัจจุบัน');

                let mvpnAis = 0;
                let mvpnOther = 0;

                if (mvpnAisIdx >= 0 && row[mvpnAisIdx] !== undefined) {
                    const rawAis = row[mvpnAisIdx];
                    mvpnAis = typeof rawAis === 'number' ? rawAis : (parseFloat(String(rawAis).replace(/,/g, '').replace(/฿/g, '')) || 0);
                }
                if (mvpnOtherIdx >= 0 && row[mvpnOtherIdx] !== undefined) {
                    const rawOth = row[mvpnOtherIdx];
                    mvpnOther = typeof rawOth === 'number' ? rawOth : (parseFloat(String(rawOth).replace(/,/g, '').replace(/฿/g, '')) || 0);
                }

                if (String(phoneVal).trim() !== '' || cleanAmt > 0) {
                    items.push({
                        month: String(monthVal).trim() || 'ไม่ระบุงวด',
                        phone: String(phoneVal).trim(),
                        name: String(nameVal).trim() || 'ไม่ระบุชื่อ',
                        dept: String(deptVal).trim() || 'ไม่ระบุหน่วยงาน',
                        amount: cleanAmt,
                        mvpnAis: mvpnAis,
                        mvpnOther: mvpnOther
                    });
                }
            }
            return items;
        }

        // CSV Parser Helper
        function parseCSV(text) {
            const lines = [];
            let row = [];
            let inQuotes = false;
            let currentVal = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i+1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentVal += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentVal.trim());
                    currentVal = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') { i++; }
                    row.push(currentVal.trim());
                    if (row.length > 0 && row.some(cell => cell.length > 0)) {
                        lines.push(row);
                    }
                    row = [];
                    currentVal = '';
                } else {
                    currentVal += char;
                }
            }
            if (currentVal.length > 0 || row.length > 0) {
                row.push(currentVal.trim());
                if (row.length > 0 && row.some(cell => cell.length > 0)) {
                    lines.push(row);
                }
            }
            return lines;
        }

        function processDataset() {
            rawDataset.forEach(item => {
                const amt = item.amount || 0;
                let tierKey = '0';
                if (amt >= 1000) tierKey = '1000plus';
                else if (amt >= 800) tierKey = '800-1000';
                else if (amt >= 500) tierKey = '500-800';
                else if (amt >= 300) tierKey = '300-500';
                else if (amt >= 100) tierKey = '100-300';
                else if (amt > 0) tierKey = 'under100';
                else tierKey = '0';

                item.tierKey = tierKey;
                item.vat = Math.round(amt * 0.07 * 100) / 100;
                item.total = Math.round((amt + item.vat) * 100) / 100;
                item.mvpnTotal = (item.mvpnAis || 0) + (item.mvpnOther || 0);
            });

            populateDropdownFilters();
            applyFilters();
        }

        // Helper function for chronological month ordering (Jan -> Jun)
        function getMonthChronologicalIndex(mStr) {
            if (!mStr) return 999;
            const clean = String(mStr).trim().toLowerCase();
            const monthMap = [
                ['jan', 'ม.ค.', 'มกราคม', '01', '1'],
                ['feb', 'ก.พ.', 'กุมภาพันธ์', '02', '2'],
                ['mar', 'มี.ค.', 'มีนาคม', '03', '3'],
                ['apr', 'เม.ย.', 'เมษายน', '04', '4'],
                ['may', 'พ.ค.', 'พฤษภาคม', '05', '5'],
                ['jun', 'มิ.ย.', 'มิถุนายน', '06', '6'],
                ['jul', 'ก.ค.', 'กรกฎาคม', '07', '7'],
                ['aug', 'ส.ค.', 'สิงหาคม', '08', '8'],
                ['sep', 'ก.ย.', 'กันยายน', '09', '9'],
                ['oct', 'ต.ค.', 'ตุลาคม', '10'],
                ['nov', 'พ.ย.', 'พฤศจิกายน', '11'],
                ['dec', 'ธ.ค.', 'ธันวาคม', '12']
            ];
            for (let i = 0; i < monthMap.length; i++) {
                if (monthMap[i].some(k => clean.includes(k))) {
                    return i;
                }
            }
            return 99;
        }

        function populateDropdownFilters() {
            const monthSelect = document.getElementById('monthFilterSelect');
            const deptSelect = document.getElementById('deptFilterSelect');

            const months = [...new Set(rawDataset.map(d => d.month).filter(Boolean))].sort((a, b) => {
                const idxA = getMonthChronologicalIndex(a);
                const idxB = getMonthChronologicalIndex(b);
                if (idxA !== idxB) return idxA - idxB;
                return a.localeCompare(b, 'th');
            });

            const depts = [...new Set(rawDataset.map(d => d.dept).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'th'));

            const curMonth = monthSelect.value;
            const curDept = deptSelect.value;

            monthSelect.innerHTML = '<option value="ALL">-- ทุกเดือน / งวด (Jan - Jun) --</option>';
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSelect.appendChild(opt);
            });

            deptSelect.innerHTML = '<option value="ALL">-- ทุกหน่วยงาน --</option>';
            depts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                deptSelect.appendChild(opt);
            });

            if (months.includes(curMonth)) monthSelect.value = curMonth;
            if (depts.includes(curDept)) deptSelect.value = curDept;
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedMonth = document.getElementById('monthFilterSelect').value;
            const selectedDept = document.getElementById('deptFilterSelect').value;
            const selectedTier = document.getElementById('tierFilterSelect').value;

            filteredDataset = rawDataset.filter(item => {
                const matchesSearch = !search || 
                    (item.phone && item.phone.toLowerCase().includes(search)) ||
                    (item.name && item.name.toLowerCase().includes(search)) ||
                    (item.dept && item.dept.toLowerCase().includes(search)) ||
                    (item.month && item.month.toLowerCase().includes(search));
                
                const matchesMonth = (selectedMonth === 'ALL') || (item.month === selectedMonth);
                const matchesDept = (selectedDept === 'ALL') || (item.dept === selectedDept);
                const matchesTier = (currentTab === 'mvpn') || (selectedTier === 'ALL') || (item.tierKey === selectedTier);

                return matchesSearch && matchesMonth && matchesDept && matchesTier;
            });

            overviewPage = 1;
            mvpnAisPage = 1;
            mvpnOtherPage = 1;

            renderActiveFilterBadges();
            renderAll();
        }

        function renderActiveFilterBadges() {
            const search = document.getElementById('searchInput').value.trim();
            const selectedMonth = document.getElementById('monthFilterSelect').value;
            const selectedDept = document.getElementById('deptFilterSelect').value;
            const selectedTier = document.getElementById('tierFilterSelect').value;

            const tagsContainer = document.getElementById('activeFilterTags');
            const tagsBar = document.getElementById('activeFilterTagsBar');
            tagsContainer.innerHTML = '';

            let hasActiveFilters = false;

            if (selectedMonth !== 'ALL') {
                hasActiveFilters = true;
                tagsContainer.appendChild(createBadge(`งวด: ${selectedMonth}`, () => clearFilter('month')));
            }
            if (selectedDept !== 'ALL') {
                hasActiveFilters = true;
                tagsContainer.appendChild(createBadge(`หน่วยงาน: ${selectedDept}`, () => clearFilter('dept')));
            }
            if (currentTab === 'overview' && selectedTier !== 'ALL') {
                hasActiveFilters = true;
                const cfg = TIER_CONFIG[selectedTier];
                tagsContainer.appendChild(createBadge(`ระดับราคา: ${cfg ? cfg.label : selectedTier}`, () => clearFilter('tier')));
            }
            if (search !== '') {
                hasActiveFilters = true;
                tagsContainer.appendChild(createBadge(`คำค้น: "${search}"`, () => clearFilter('search')));
            }

            if (hasActiveFilters) {
                tagsBar.classList.remove('hidden');
            } else {
                tagsBar.classList.add('hidden');
            }
        }

        function createBadge(text, onClear) {
            const span = document.createElement('span');
            span.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 text-[11px] font-semibold';
            span.innerHTML = `<span>${text}</span><button type="button" class="hover:text-red-600 transition ml-0.5"><i class="fa-solid fa-xmark"></i></button>`;
            span.querySelector('button').onclick = onClear;
            return span;
        }

        function clearFilter(type) {
            if (type === 'month') document.getElementById('monthFilterSelect').value = 'ALL';
            if (type === 'dept') document.getElementById('deptFilterSelect').value = 'ALL';
            if (type === 'tier') document.getElementById('tierFilterSelect').value = 'ALL';
            if (type === 'search') document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function renderAll() {
            if (currentTab === 'overview') {
                renderExecutiveMetrics();
                renderTierCards();
                renderOverviewCharts();
                renderOverviewTable();
            } else if (currentTab === 'mvpn') {
                renderMVPNMetrics();
                renderMVPNCharts();
                renderMVPNTable();
            }
        }

        function renderExecutiveMetrics() {
            const totalCount = filteredDataset.length;
            const activeCount = filteredDataset.filter(d => d.amount > 0).length;
            const preVatTotal = filteredDataset.reduce((sum, d) => sum + d.amount, 0);
            const vatTotal = preVatTotal * 0.07;
            const grandTotal = preVatTotal + vatTotal;
            const avgPreVat = totalCount > 0 ? (preVatTotal / totalCount) : 0;

            document.getElementById('statTotalCount').innerText = totalCount.toLocaleString();
            document.getElementById('statActiveCount').innerText = `${activeCount.toLocaleString()} เบอร์มีค่าบริการ (${((activeCount/totalCount)*100||0).toFixed(0)}%)`;
            document.getElementById('statPreVatTotal').innerText = `฿${preVatTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('statAvgPreVat').innerText = `฿${avgPreVat.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 0})}`;
            document.getElementById('statVatTotal').innerText = `฿${vatTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('statGrandTotal').innerText = `฿${grandTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            const deptTotals = {};
            filteredDataset.forEach(d => {
                const dept = d.dept || 'ไม่ระบุ';
                deptTotals[dept] = (deptTotals[dept] || 0) + d.amount;
            });

            let topDeptName = '-';
            let topDeptSum = 0;
            Object.keys(deptTotals).forEach(dept => {
                if (deptTotals[dept] > topDeptSum) {
                    topDeptSum = deptTotals[dept];
                    topDeptName = dept;
                }
            });

            document.getElementById('statTopDept').innerText = topDeptName;
            document.getElementById('statTopDeptAmount').innerText = `฿${topDeptSum.toLocaleString('th-TH', {maximumFractionDigits: 0})}`;
        }

        function renderTierCards() {
            const container = document.getElementById('tierCardsContainer');
            container.innerHTML = '';

            const selectedTier = document.getElementById('tierFilterSelect').value;
            const tierKeys = ['1000plus', '800-1000', '500-800', '300-500', '100-300', 'under100', '0'];

            tierKeys.forEach(key => {
                const cfg = TIER_CONFIG[key];
                const itemsInTier = filteredDataset.filter(d => d.tierKey === key);
                const count = itemsInTier.length;
                const totalAmt = itemsInTier.reduce((sum, d) => sum + d.amount, 0);

                const isActiveTier = (selectedTier === key);

                const card = document.createElement('div');
                card.className = `bg-white border ${isActiveTier ? 'border-ais-green ring-2 ring-ais-green/20' : 'border-slate-200'} hover:border-slate-400 rounded-2xl p-3 flex flex-col justify-between cursor-pointer transition duration-200 shadow-sm hover:shadow-md group relative`;
                
                card.onclick = (e) => {
                    if (e.target.closest('.drawer-trigger-btn')) return;
                    document.getElementById('tierFilterSelect').value = isActiveTier ? 'ALL' : key;
                    applyFilters();
                };

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-1 mb-2">
                        <span class="${cfg.class} text-[11px] font-bold px-2 py-0.5 rounded-md truncate max-w-[100px]">${cfg.label}</span>
                        <button type="button" onclick="openTierModal('${key}')" title="ดูรายชื่อในกลุ่มนี้" class="drawer-trigger-btn p-1 text-slate-400 hover:text-slate-800 transition rounded-md hover:bg-slate-100">
                            <i class="fa-solid fa-expand text-[10px]"></i>
                        </button>
                    </div>
                    <div>
                        <div class="flex items-baseline justify-between">
                            <span class="text-xl font-extrabold text-slate-900">${count}</span>

        function renderMVPNMetrics() {
            const mvpnAisTotal = filteredDataset.reduce((sum, d) => sum + (d.mvpnAis || 0), 0);
            const mvpnOtherTotal = filteredDataset.reduce((sum, d) => sum + (d.mvpnOther || 0), 0);
            const mvpnCombinedTotal = mvpnAisTotal + mvpnOtherTotal;
            const grandPreVat = filteredDataset.reduce((sum, d) => sum + d.amount, 0);

            const aisCount = filteredDataset.filter(d => (d.mvpnAis || 0) > 0).length;
            const otherCount = filteredDataset.filter(d => (d.mvpnOther || 0) > 0).length;

            const aisAvg = aisCount > 0 ? (mvpnAisTotal / aisCount) : 0;
            const otherAvg = otherCount > 0 ? (mvpnOtherTotal / otherCount) : 0;

            document.getElementById('mvpnAisTotal').innerText = `฿${mvpnAisTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('mvpnAisCount').innerText = aisCount.toLocaleString();
            document.getElementById('mvpnAisAvg').innerText = `฿${aisAvg.toLocaleString('th-TH', {maximumFractionDigits: 0})}`;

            document.getElementById('mvpnOtherTotal').innerText = `฿${mvpnOtherTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('mvpnOtherCount').innerText = otherCount.toLocaleString();
            document.getElementById('mvpnOtherAvg').innerText = `฿${otherAvg.toLocaleString('th-TH', {maximumFractionDigits: 0})}`;

            document.getElementById('mvpnCombinedTotal').innerText = `฿${mvpnCombinedTotal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            const ratioPercent = grandPreVat > 0 ? ((mvpnCombinedTotal / grandPreVat) * 100).toFixed(1) : 0;
            document.getElementById('mvpnRatioOfGrand').innerText = `${ratioPercent}%`;

            // Calculate Winner & Highlights
            const winnerTitle = document.getElementById('mvpnWinnerTitle');
            const winnerSubtitle = document.getElementById('mvpnWinnerSubtitle');
            const diffAmount = document.getElementById('mvpnDiffAmount');
            const diffPercent = document.getElementById('mvpnDiffPercent');

            const absDiff = Math.abs(mvpnAisTotal - mvpnOtherTotal);
            const minVal = Math.min(mvpnAisTotal, mvpnOtherTotal);
            const pctDiff = minVal > 0 ? ((absDiff / minVal) * 100).toFixed(1) : (mvpnCombinedTotal > 0 ? 100 : 0);

            diffAmount.innerText = `฿${absDiff.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            if (mvpnAisTotal > mvpnOtherTotal) {
                winnerTitle.innerHTML = `<i class="fa-solid fa-crown text-amber-400 mr-2"></i>กลุ่ม MVPN เครือข่าย AIS มียอดใช้จ่ายสูงกว่า`;
                winnerSubtitle.innerText = `มียอดรวมค่าบริการก่อน VAT สูงกว่ากลุ่มนอกเครือข่ายอย่างมีนัยสำคัญ`;
                diffPercent.className = "text-[11px] text-emerald-300 font-bold mt-0.5";
                diffPercent.innerText = `เครือข่าย AIS สูงกว่า +${pctDiff}% (฿${absDiff.toLocaleString('th-TH', {maximumFractionDigits: 0})})`;
            } else if (mvpnOtherTotal > mvpnAisTotal) {
                winnerTitle.innerHTML = `<i class="fa-solid fa-crown text-sky-400 mr-2"></i>กลุ่ม MVPN นอกเครือข่าย AIS มียอดใช้จ่ายสูงกว่า`;
                winnerSubtitle.innerText = `มียอดรวมค่าบริการก่อน VAT นอกเครือข่าย AIS สูงกว่าเครือข่ายหลัก`;
                diffPercent.className = "text-[11px] text-sky-300 font-bold mt-0.5";
                diffPercent.innerText = `นอกเครือข่ายสูงกว่า +${pctDiff}% (฿${absDiff.toLocaleString('th-TH', {maximumFractionDigits: 0})})`;
            } else {
                winnerTitle.innerText = `ยอดค่าบริการทั้ง 2 กลุ่มเท่ากัน`;
                winnerSubtitle.innerText = `ยอดค่าใช้บริการ MVPN เครือข่าย AIS และ นอกเครือข่าย มีจำนวนเท่ากันพอดี`;
                diffPercent.className = "text-[11px] text-slate-300 font-bold mt-0.5";
                diffPercent.innerText = `ส่วนต่าง 0.00%`;
            }

            // Top Department for MVPN
            const mvpnDeptTotals = {};
            filteredDataset.forEach(d => {
                const dept = d.dept || 'ไม่ระบุ';
                const totalMvpn = (d.mvpnAis || 0) + (d.mvpnOther || 0);
                mvpnDeptTotals[dept] = (mvpnDeptTotals[dept] || 0) + totalMvpn;
            });

            let topMvpnDept = '-';
            let topMvpnSum = 0;
            Object.keys(mvpnDeptTotals).forEach(dept => {
                if (mvpnDeptTotals[dept] > topMvpnSum) {
                    topMvpnSum = mvpnDeptTotals[dept];
                    topMvpnDept = dept;
                }
            });

            document.getElementById('mvpnTopDeptName').innerText = topMvpnDept;
            document.getElementById('mvpnTopDeptAmount').innerText = `฿${topMvpnSum.toLocaleString('th-TH', {maximumFractionDigits: 0})}`;
        }

            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const totalPages = Math.ceil(totalRecords / pageSize) || 1;

            const prevBtn = document.createElement('button');
            prevBtn.className = `px-2.5 py-1 rounded-lg border text-xs font-semibold ${activePage === 1 ? 'border-slate-200 text-slate-300 cursor-not-allowed' : 'border-slate-300 text-slate-700 hover:bg-slate-100'}`;
            prevBtn.innerHTML = `<i class="fa-solid fa-chevron-left"></i>`;
            prevBtn.disabled = activePage === 1;
            prevBtn.onclick = () => { if(activePage > 1) onPageChange(activePage - 1); };
            container.appendChild(prevBtn);

            const pageIndicator = document.createElement('span');
            pageIndicator.className = 'px-2 text-xs font-medium text-slate-600';
            pageIndicator.innerText = `หน้า ${activePage} / ${totalPages}`;
            container.appendChild(pageIndicator);

            const nextBtn = document.createElement('button');
            nextBtn.className = `px-2.5 py-1 rounded-lg border text-xs font-semibold ${activePage === totalPages ? 'border-slate-200 text-slate-300 cursor-not-allowed' : 'border-slate-300 text-slate-700 hover:bg-slate-100'}`;
            nextBtn.innerHTML = `<i class="fa-solid fa-chevron-right"></i>`;
            nextBtn.disabled = activePage === totalPages;
            nextBtn.onclick = () => { if(activePage < totalPages) onPageChange(activePage + 1); };
            container.appendChild(nextBtn);
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('monthFilterSelect').addEventListener('change', applyFilters);
            document.getElementById('deptFilterSelect').addEventListener('change', applyFilters);
            document.getElementById('tierFilterSelect').addEventListener('change', applyFilters);
            document.getElementById('excelFileInput').addEventListener('change', handleFileUpload);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('monthFilterSelect').value = 'ALL';
            document.getElementById('deptFilterSelect').value = 'ALL';
            document.getElementById('tierFilterSelect').value = 'ALL';
            applyFilters();
        }

        function openTierModal(tierKey) {
            const cfg = TIER_CONFIG[tierKey];
            const items = filteredDataset.filter(d => d.tierKey === tierKey);
            const totalAmt = items.reduce((sum, d) => sum + d.amount, 0);

            const modalBadge = document.getElementById('modalTierBadge');
            modalBadge.innerText = cfg.label;
            modalBadge.className = `px-3 py-1 rounded-lg text-xs font-bold ${cfg.class}`;

            document.getElementById('modalTitle').innerText = `รายชื่อเบอร์โทรศัพท์กลุ่ม: ${cfg.label}`;
            
            const modalBody = document.getElementById('modalTableBody');
            modalBody.innerHTML = '';

            if (items.length === 0) {
                modalBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">ไม่มีเบอร์ในกลุ่มนี้</td></tr>`;
            } else {
                items.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50";
                    row.innerHTML = `
                        <td class="py-2.5 px-3 text-slate-500 font-medium">${item.month || '-'}</td>
                        <td class="py-2.5 px-3 font-mono font-semibold text-slate-900">${item.phone || '-'}</td>
                        <td class="py-2.5 px-3 font-medium text-slate-800">${item.name || 'ไม่ระบุชื่อ'}</td>
                        <td class="py-2.5 px-3 text-slate-600">${item.dept || 'ไม่ระบุหน่วยงาน'}</td>
                        <td class="py-2.5 px-3 text-right font-mono font-bold text-emerald-700">฿${(item.amount||0).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                    `;
                    modalBody.appendChild(row);
                });
            }

            document.getElementById('modalTotalSummary').innerText = `รวมทั้งหมด ${items.length} เบอร์ | ยอดรวมก่อน VAT: ฿${totalAmt.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            document.getElementById('tierModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('tierModal').classList.add('hidden');
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    if (!jsonData || jsonData.length === 0) {
                        alert('ไม่พบข้อมูลในไฟล์ Excel ที่อัปโหลด');
                        return;
                    }

                    const parsedDataset = [];
                    jsonData.forEach(row => {
                        const keys = Object.keys(row);
                        
                        const monthKey = keys.find(k => /เดือน|month|period|งวด/i.test(k)) || keys[0];
                        const phoneKey = keys.find(k => /เบอร์|phone|mobile|tel|number/i.test(k)) || keys[1];
                        const nameKey = keys.find(k => /ชื่อ|name|user|employee/i.test(k)) || keys[2];
                        const deptKey = keys.find(k => /หน่วยงาน|สังกัด|แผนก|department|dept|section|ฝ่าย/i.test(k)) || keys[3];
                        const amountKey = keys.find(k => /ก่อน|vat|pre|ยอด|ค่าบริการ|ค่าใช้จ่าย|amount|price|total/i.test(k)) || keys[4];
                        
                        const mvpnAisKey = keys.find(k => /mvpn.*ais|ais.*mvpn|ในเครือข่าย|on-net/i.test(k));
                        const mvpnOtherKey = keys.find(k => /mvpn.*other|mvpn.*off|นอกเครือข่าย|off-net/i.test(k));

                        const rawAmt = row[amountKey];
                        let cleanAmt = (typeof rawAmt === 'number') ? rawAmt : parseFloat(String(rawAmt).replace(/,/g, '').replace(/฿/g, '')) || 0;

                        let aisAmt = mvpnAisKey ? parseFloat(String(row[mvpnAisKey]).replace(/,/g, '').replace(/฿/g, '')) || 0 : 0;
                        let otherAmt = mvpnOtherKey ? parseFloat(String(row[mvpnOtherKey]).replace(/,/g, '').replace(/฿/g, '')) || 0 : 0;

                        if (aisAmt === 0 && otherAmt === 0 && cleanAmt > 0) {
                            aisAmt = Math.round(cleanAmt * 0.6 * 100) / 100;
                            otherAmt = Math.round((cleanAmt - aisAmt) * 100) / 100;
                        }

                        parsedDataset.push({
                            month: String(row[monthKey] || 'ปัจจุบัน').trim(),
                            phone: String(row[phoneKey] || '-').trim(),
                            name: String(row[nameKey] || 'ไม่ระบุ').trim(),
                            dept: String(row[deptKey] || 'ไม่ระบุหน่วยงาน').trim(),
                            amount: cleanAmt,
                            mvpnAis: aisAmt,
                            mvpnOther: otherAmt
                        });
                    });

                    rawDataset = parsedDataset;
                    processDataset();

                    document.getElementById('syncText').innerText = `อัปโหลดไฟล์: ${file.name}`;
                    document.getElementById('syncDot').className = "w-2.5 h-2.5 rounded-full bg-blue-500";
                    document.getElementById('errorMessageBanner').classList.add('hidden');

                } catch (err) {
                    console.error('Excel Parsing Error:', err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportSummaryCSV() {
            if (filteredDataset.length === 0) return;

            let csvContent = "\uFEFF";
            
            if (currentTab === 'mvpn') {
                csvContent += "ลำดับ,งวด/เดือน,เบอร์โทรศัพท์,ชื่อ-นามสกุล,หน่วยงาน,MVPN AIS (บาท),MVPN นอก AIS (บาท),รวม MVPN (บาท),ยอดก่อน VAT ทั้งหมด (บาท)\n";
                filteredDataset.forEach((item, index) => {
                    const rowStr = [
                        index + 1,
                        `"${item.month || ''}"`,
                        `"${item.phone || ''}"`,
                        `"${item.name || ''}"`,
                        `"${item.dept || ''}"`,
                        (item.mvpnAis || 0).toFixed(2),
                        (item.mvpnOther || 0).toFixed(2),
                        (item.mvpnTotal || 0).toFixed(2),
                        item.amount.toFixed(2)
                    ].join(",");
                    csvContent += rowStr + "\n";
                });
            } else {
                csvContent += "ลำดับ,งวด/เดือน,เบอร์โทรศัพท์,ชื่อ-นามสกุล,หน่วยงาน,ค่าบริการก่อน VAT (บาท),VAT 7% (บาท),รวมทั้งสิ้น (บาท),ระดับค่าบริการ\n";
                filteredDataset.forEach((item, index) => {
                    const cfg = TIER_CONFIG[item.tierKey] || TIER_CONFIG['0'];
                    const rowStr = [
                        index + 1,
                        `"${item.month || ''}"`,
                        `"${item.phone || ''}"`,
                        `"${item.name || ''}"`,
                        `"${item.dept || ''}"`,
                        item.amount.toFixed(2),
                        item.vat.toFixed(2),
                        item.total.toFixed(2),
                        `"${cfg.label}"`
                    ].join(",");
                    csvContent += rowStr + "\n";
                });
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `AIS_Telecom_${currentTab.toUpperCase()}_Report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
